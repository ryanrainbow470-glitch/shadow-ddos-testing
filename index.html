<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07070d"><title>SHADOW // DDOS TESTING</title>
<meta name="description" content="SHADOW — controlled website resilience and load testing.">
<style>
:root{color-scheme:dark;--bg:#07070d;--fg:#f4f1ff}*{box-sizing:border-box}
html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 18% 20%,#7027ff24,transparent 38%),radial-gradient(ellipse at 80% 76%,#00e5ff1b,transparent 34%),radial-gradient(ellipse at 65% 15%,#ff2db51a,transparent 30%),var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center,black 15%,transparent 82%)}
main{position:relative;width:min(94vw,1000px);padding:48px 22px;text-align:center}.eyebrow{font-size:clamp(.68rem,2vw,.82rem);letter-spacing:.38em;color:#a6a0bb;margin-bottom:28px}
h1{margin:0;font-size:clamp(2.25rem,8.5vw,6.6rem);line-height:1.04;font-weight:900;letter-spacing:-.055em;text-wrap:balance;background:linear-gradient(100deg,#ff4fd8,#b96cff 25%,#64d8ff 52%,#6effb2 76%,#ffe66d);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:rainbow 8s linear infinite;filter:drop-shadow(0 0 22px #a347ff35)}
.rule{width:min(380px,70%);height:1px;margin:32px auto 24px;background:linear-gradient(90deg,transparent,#b96cff,#64d8ff,#6effb2,transparent)}
.sub{color:#c3bed3;font-size:clamp(.8rem,2vw,1rem);letter-spacing:.12em}.status{display:inline-flex;align-items:center;gap:9px;margin-top:34px;padding:10px 14px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff06;color:#a8a2b9;font-size:.7rem;letter-spacing:.12em}.dot{width:7px;height:7px;border-radius:50%;background:#6effb2;box-shadow:0 0 12px #6effb2}
footer{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#686378;font-size:.66rem;letter-spacing:.14em;padding:0 12px}@keyframes rainbow{to{background-position:220% center}}@media(prefers-reduced-motion:reduce){h1{animation:none}}
</style></head><body><main><div class="eyebrow">S H A D O W &nbsp; / &nbsp; N E T W O R K&nbsp; L A B</div><h1>SHADOW DDOS<br>TESTING</h1><div class="rule"></div><div class="sub">CONTROLLED LOAD TESTING · SITE RESILIENCE</div><div class="status"><span class="dot"></span> AUTHORIZED TESTING ONLY</div></main><footer>SHADOW // DEFENSIVE NETWORK TESTING</footer></body></html>
